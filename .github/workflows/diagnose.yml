name: Diagnose buildozer.spec location

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find buildozer.spec location
        run: |
          echo "=== Current working directory ==="
          pwd
          
          echo -e "\n=== Root directory contents ==="
          ls -la
          
          echo -e "\n=== Searching for buildozer.spec ==="
          find . -name "buildozer.spec" -type f 2>/dev/null || echo "No buildozer.spec found"
          
          echo -e "\n=== Checking common locations ==="
          [ -f ./buildozer.spec ] && echo "✓ Found at: ./buildozer.spec" || echo "✗ Not at: ./buildozer.spec"
          [ -f ./file-difference-comparison/buildozer.spec ] && echo "✓ Found at: ./file-difference-comparison/buildozer.spec" || echo "✗ Not at: ./file-difference-comparison/buildozer.spec"
          
          echo -e "\n=== Tree structure (first 3 levels) ==="
          find . -maxdepth 3 -type f | grep -E "\.(spec|py)$" | head -30
