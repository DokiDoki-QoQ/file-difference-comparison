name: Build APK with Buildozer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies and libtoolize
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip \
            autoconf automake libtool libtool-bin libltdl-dev autoconf-archive m4 pkg-config zlib1g-dev \
            libbz2-dev liblzma-dev libncurses5-dev libncursesw5-dev libtinfo-dev \
            libreadline-dev libsqlite3-dev tk-dev libffi-dev libssl-dev build-essential gettext
          # 在此处追加 libtoolize 命令，修复 LT_SYS_SYMBOL_USCORE 宏缺失问题
          libtoolize --force --install

      - name: Install Buildozer, Cython and python-for-android
        run: |
          pip install --upgrade pip
          pip install --upgrade buildozer Cython python-for-android

      - name: Clone Gitee repo
        run: |
          git clone https://gitee.com/jupiter-001/file-difference-comparison.git
          ls -la file-difference-comparison/

      - name: Build APK
        run: |
          cd file-difference-comparison
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          yes | buildozer -v android debug

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: diffapp-apk
          path: file-difference-comparison/bin/*.apk
